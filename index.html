const screen=document.querySelector('#screen'),score=document.querySelector('#score');
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function home(){
 kid=null;mode=null;score.textContent='Vyber si, jak chcete hrát';

function pickMode(m){

}
function selectQuestions(who){
 // Uložená historie je společná pro oba herní režimy.
 const key='hadankovy-svet-seen-v2-'+who;
 const all=data[who], ids=all.map((_,i)=>i);
 let seen=[];
 try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))seen=stored.filter(i=>Number.isInteger(i)&&i>=0&&i<all.length)}catch(e){}
 let unseen=shuffle(ids.filter(i=>!seen.includes(i)));
 // Nové kolo se nikdy neopakuje uvnitř jednoho večera.
 if(unseen.length<10){
   const remainder=shuffle(ids.filter(i=>!unseen.includes(i)));
   unseen=[...unseen,...remainder.slice(0,10-unseen.length)];
   seen=[];
 }
 const chosen=unseen.slice(0,10);
 try{localStorage.setItem(key,JSON.stringify([...seen,...chosen]))}catch(e){}
 return chosen.map(i=>{const q=all[i];return {text:q[0],hero:q[1],answer:q[2],options:shuffle(q.slice(3))}});
}
function start(who){
 kid=who;questions=selectQuestions(who);index=0;points=0;render();
}
function render(){

   body+='<div class="q" style="margin:50px 0 35px;min-height:125px">'+safe(q.text)+'</div><div id="answer" class="read-answer" aria-live="polite"></div>';

   body+='<button class="action" style="width:100%;margin-top:9px" id="next" onclick="next()" disabled>'+(index===9?'Dokončit':'Další hádanka ➜')+'</button>';
 } else {
   body+='<div class="hero">'+q.hero+'</div><div class="q">'+safe(q.text)+'</div><div class="options">'+q.options.map((o,i)=>'<button class="option" id="opt'+i+'" onclick="choose('+i+')"><span class="emoji">'+o[0]+'</span>'+safe(o[1])+'</button>').join('')+'</div><div class="note" id="note" aria-live="polite">Vyber správný obrázek 👆</div><div class="actions"><button class="action secondary" onclick="home()">🏠 Domů</button><button class="action secondary" onclick="hint()">💡 Nápověda</button><button class="action" id="next" onclick="next()" disabled>'+(index===9?'Dokončit 🏆':'Další ➜')+'</button></div>';

}
function hintRead(){if(done)return;document.getElementById('answer').textContent='Nápověda: začíná na „'+questions[index].answer[0]+'“.'}
function reveal(){if(done)return;done=true;document.getElementById('answer').innerHTML='<b>Odpověď:</b> '+safe(questions[index].answer);document.getElementById('next').disabled=false;document.getElementById('reveal').disabled=true}
function choose(i){
 if(done)return;const q=questions[index],o=q.options[i],btn=document.getElementById('opt'+i),note=document.getElementById('note');
 if(o[1]===q.answer){done=true;points+=attempts?1:2;btn.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);note.textContent=attempts?'Správně! ⭐':'Výborně! Dvě hvězdičky! 🌟🌟';document.getElementById('next').disabled=false;score.textContent='⭐ '+points+' · '+(kid==='laura'?'Laurinka':'Melinka')}
 else{attempts++;btn.disabled=true;btn.classList.add('wrong');note.textContent='Nevadí, zkus další obrázek 💜'}
}
function hint(){if(done)return;document.getElementById('note').textContent='Nápověda: odpověď začíná na písmeno „'+questions[index].answer[0]+'“ 🔎'}
function next(){

  return;

}
