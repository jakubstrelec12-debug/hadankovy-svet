name = "hadankovy-ai"
main = "worker.js"
compatibility_date = "2026-11-22"

[vars]
DAILY_LIMIT = "5"
GEMINI_MODEL = "gemini-3.1-flash-lite"

# KV namespace LIMITS se přidává v Cloudflare dashboardu:
# Workers & Pages > hadankovy-ai > Settings > Bindings > Add > KV namespace
# Variable name: LIMITS
# GEMINI_API_KEY přidejte jako secret (nikdy sem do souboru).
