let mode='read',players=['laura'],roundLength=10,questions=[],index=0,points=0,attempts=0,done=false,showingHint=false;
const screen=document.querySelector('#screen'),score=document.querySelector('#score');
const shuffle=a=>{const copy=[...a];for(let i=copy.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const names={laura:'Laurinka',melinka:'Melinka'};
function getSaved(k,otherwise){try{return JSON.parse(localStorage.getItem(k))??otherwise}catch(e){return otherwise}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function custom(){return getSaved('hadankovy-svet-custom-v1',[]).filter(x=>x&&['laura','melinka'].includes(x.who)&&typeof x.q==='string'&&typeof x.a==='string').slice(0,80)}
function collection(who){
 const own=custom().filter(x=>x.who===who).map(x=>[x.q,'❓',x.a,['✅',x.a],['❔','Nevím'],['💡','Nápověda'],['🧩','Jiné']]);
 return [...data[who],...own];
}
function home(){
 score.textContent='Večerní hádanky pro celou rodinu';
 screen.innerHTML='<div class="welcome"><h2>Jak si dnes zahrajete?</h2><p class="subtle">Děti odpovídají nahlas, nebo si vyberou obrázek.</p>'
 +'<div class="fieldlabel">Způsob hraní</div><div class="mode-row"><button class="choice '+(mode==='read'?'active':'')+'" onclick="setMode(\'read\')">📖 Jen čtení</button><button class="choice '+(mode==='picture'?'active':'')+'" onclick="setMode(\'picture\')">🧩 S obrázky</button></div>'
 +'<div class="fieldlabel">Kdo bude hádat?</div><div class="mode-row"><button class="choice '+(players.length===1&&players[0]==='laura'?'active':'')+'" onclick="setPlayers(\'laura\')">🐣 Laurinka · 3+</button><button class="choice '+(players.length===1&&players[0]==='melinka'?'active':'')+'" onclick="setPlayers(\'melinka\')">🦄 Melinka · 5+</button></div>'
 +'<button class="choice '+(players.length===2?'active':'')+'" onclick="setPlayers(\'both\')">👭 Obě se střídají</button>'
 +'<div class="fieldlabel">Délka večerního kola</div><div class="mode-row">'+[5,10,15].map(n=>'<button class="choice '+(roundLength===n?'active':'')+'" onclick="setLength('+n+')">'+n+' hádanek</button>').join('')+'</div>'
 +'<button class="action launch" onclick="start()">Začít hádat →</button><button class="action secondary" onclick="editCustom()">✏️ Vlastní hádanky</button>'
 +'<p class="subtle">Použité hádanky se pamatují v tomto prohlížeči. Zásoba: '+collection('laura').length+' lehkých a '+collection('melinka').length+' středně těžkých.</p></div>';
}
function setMode(x){mode=x;save('hadankovy-svet-mode',x);home()}
function setPlayers(x){players=x==='both'?['laura','melinka']:[x];home()}
function setLength(x){roundLength=x;home()}
function selectQuestions(who,count){
 const key='hadankovy-svet-seen-v3-'+who,all=collection(who),ids=all.map((_,i)=>i);
 const raw=getSaved(key,[]);
 let seen=Array.isArray(raw)?raw.filter(i=>Number.isInteger(i)&&i>=0&&i<all.length):[];
 let unseen=shuffle(ids.filter(i=>!seen.includes(i)));
 const chosen=unseen.slice(0,count);
 if(chosen.length<count){
  // At the boundary, begin a new cycle, excluding the current round.
  const rest=shuffle(ids.filter(i=>!chosen.includes(i))).slice(0,count-chosen.length);
  chosen.push(...rest);seen=[];
 }
 save(key,[...seen,...chosen]);
 return chosen.map(i=>{const q=all[i];return {who,text:q[0],hero:q[1],answer:q[2],options:shuffle(q.slice(3))}});
}
function start(){
 const list=players.length===2?[
 ...selectQuestions('laura',Math.ceil(roundLength/2)),
 ...selectQuestions('melinka',Math.floor(roundLength/2))
 ]:selectQuestions(players[0],roundLength);
 if(players.length===2){
  const la=list.filter(q=>q.who==='laura'),me=list.filter(q=>q.who==='melinka');
  questions=[];for(let i=0;i<roundLength;i++)questions.push(i%2===0?la.shift():me.shift());
 }else questions=list;
 index=0;points=0;render();
}
function render(){
 const q=questions[index];done=false;attempts=0;showingHint=false;
 score.textContent=(mode==='read'?'📖 Předčítání':'⭐ '+points+' hvězdiček')+' · '+(players.length===2?'Společná hra':names[q.who]);
 let body='<div class="eyebrow">'+names[q.who]+' · Hádanka '+(index+1)+' z '+questions.length+'</div><div class="track"><div class="fill" style="width:'+index/questions.length*100+'%"></div></div>';
 if(mode==='read'){
  body+='<div class="q reading-question">'+safe(q.text)+'</div><div id="answer" class="read-answer" aria-live="polite"></div><div class="actions"><button class="action secondary" onclick="home()">⌂ Domů</button><button class="action secondary" onclick="hintRead()">Nápověda</button><button class="action" id="reveal" onclick="reveal()">Odpověď</button></div><button class="action next-wide" id="next" onclick="next()" disabled>'+(index===questions.length-1?'Dokončit':'Další hádanka →')+'</button>';
 }else{
  body+='<div class="hero">'+q.hero+'</div><div class="q">'+safe(q.text)+'</div><div class="options">'+q.options.map((o,i)=>'<button class="option" id="opt'+i+'" onclick="choose('+i+')"><span class="emoji">'+safe(o[0])+'</span>'+safe(o[1])+'</button>').join('')+'</div><div class="note" id="note" aria-live="polite">Vyber správný obrázek</div><div class="actions"><button class="action secondary" onclick="home()">⌂ Domů</button><button class="action secondary" onclick="hint()">Nápověda</button><button class="action" id="next" onclick="next()" disabled>'+(index===questions.length-1?'Dokončit':'Další →')+'</button></div>';
 }
 screen.innerHTML=body;
}
function hintRead(){if(done)return;showingHint=true;document.getElementById('answer').textContent='Nápověda: první písmeno je „'+questions[index].answer[0]+'“.'}
function reveal(){if(done)return;done=true;document.getElementById('answer').innerHTML='<b>Správná odpověď</b>'+safe(questions[index].answer);document.getElementById('next').disabled=false;document.getElementById('reveal').disabled=true}
function choose(i){
 if(done)return;const q=questions[index],o=q.options[i],btn=document.getElementById('opt'+i),note=document.getElementById('note');
 if(o[1]===q.answer){done=true;points+=attempts?1:2;btn.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);note.textContent=attempts?'Správně! ⭐':'Výborně! 🌟🌟';document.getElementById('next').disabled=false;score.textContent='⭐ '+points+' hvězdiček'}
 else{attempts++;btn.disabled=true;btn.classList.add('wrong');note.textContent='Zkus to ještě jednou'}
}
function hint(){if(done)return;document.getElementById('note').textContent='Nápověda: odpověď začíná na „'+questions[index].answer[0]+'“'}
function next(){
 if(!done)return;
 if(index===questions.length-1){
  score.textContent='Večerní kolo dokončeno';
  screen.innerHTML='<div class="end"><h2>Výborně! 🌙</h2><p>Máte za sebou '+questions.length+' hádanek. Krásné sny!</p>'+(mode==='picture'?'<p>Celkem '+points+' hvězdiček ⭐</p>':'')+'<button class="action" onclick="start()">Další kolo</button><button class="action secondary" onclick="home()">Zpět na začátek</button></div>';return;
 }
 index++;render();
}
function editCustom(){
 score.textContent='Vlastní hádanky';
 const own=custom();
 screen.innerHTML='<div class="welcome"><h2>Vaše rodinné hádanky</h2><p class="subtle">Přidáte si vlastní otázky. Uloží se jen v tomto prohlížeči.</p><label class="fieldlabel" for="whoOwn">Obtížnost</label><select id="whoOwn"><option value="laura">Lehké (3+)</option><option value="melinka">Střední (5+)</option></select><label class="fieldlabel" for="ownQ">Hádanka</label><textarea id="ownQ" rows="3" maxlength="220" placeholder="Co má čtyři nohy a štěká?"></textarea><label class="fieldlabel" for="ownA">Odpověď</label><input id="ownA" maxlength="90" placeholder="Pejsek"><button class="action" onclick="addCustom()">Uložit hádanku</button><div class="subtle">Vaše vlastní hádanky: '+own.length+' / 80</div><div class="own-list">'+own.map((x,i)=>'<div class="own-line"><span>'+safe(x.q)+'</span><button class="action secondary" onclick="removeCustom('+i+')">Smazat</button></div>').join('')+'</div><button class="action secondary" onclick="home()">← Zpět</button></div>';
}
function addCustom(){
 const q=document.getElementById('ownQ').value.trim(),a=document.getElementById('ownA').value.trim(),who=document.getElementById('whoOwn').value;
 if(!q||!a){alert('Vyplňte otázku i odpověď.');return}
 const own=custom();if(own.length>=80){alert('Zásoba vlastních hádanek je plná.');return}
 own.push({q,a,who});save('hadankovy-svet-custom-v1',own);editCustom();
}
function removeCustom(i){const own=custom();own.splice(i,1);save('hadankovy-svet-custom-v1',own);save('hadankovy-svet-seen-v3-laura',[]);save('hadankovy-svet-seen-v3-melinka',[]);editCustom()}
mode=getSaved('hadankovy-svet-mode','read')==='picture'?'picture':'read';

home();
</script></body></html>
